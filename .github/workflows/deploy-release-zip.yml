name: Deploy GitHub Pages from Release Zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (leave blank for latest)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web.zip using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./site-content
          
          # Determine which tag to download from
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            echo "Fetching latest release tag..."
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          
          echo "Downloading web.zip from release: $TAG"
          gh release download "$TAG" -p "web.zip" --dir .

          echo "Verifying downloaded file..."
          file web.zip || true

          echo "Extracting zip contents..."
          unzip -q web.zip -d ./site-content

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site-content'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4